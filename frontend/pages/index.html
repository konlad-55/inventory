<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanty Inventory - Item Entry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Item Entry</h1>
        <div class="header-actions">
            <div id="connectionStatus" class="connection-status online">Online</div>
            <div class="user-info">
                <span id="currentUser">Welcome, User</span>
            </div>
            <button type="button" class="dashboard-link back-btn" onclick="window.history.back()">Back</button>
            <a href="dashboard.html" class="dashboard-link">Dashboard</a>
            <a href="admin.html" class="dashboard-link">Admin</a>
            <a href="order-creation.html" class="dashboard-link">Create Order</a>
            <a href="order-history.html" class="dashboard-link">Order History</a>
            <button id="logoutBtn" class="dashboard-link logout-btn">Logout</button>
        </div>
    </div>
    <form id="itemForm">
        <label for="itemCode">Item Code (Auto)</label>
        <input type="text" id="itemCode" name="itemCode" readonly>

        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" name="itemName" required placeholder="Enter item name" minlength="2">

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">--Select Category--</option>
            <option value="BOXER">BOXER</option>
            <option value="FEKON">FEKON</option>
            <option value="KINGLION">KINGLION</option>
            <option value="HAUJUE">HAUJUE</option>
            <option value="TVS">TVS</option>
            <option value="GN">GN</option>
        </select>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" required placeholder="Enter quantity">

        <label for="buyingPrice">Buying Price (Tsh)</label>
        <input type="number" id="buyingPrice" name="buyingPrice" step="0.01" min="0" required placeholder="0.00">

        <label for="sellingPrice">Selling Price (Tsh)</label>
        <input type="number" id="sellingPrice" name="sellingPrice" step="0.01" min="0" required placeholder="0.00">

        <div class="form-actions-row">
            <button type="submit">Save Item</button>
            <button type="button" id="excelUploadBtn" class="secondary-btn">Upload Excel</button>
            <a href="inventory-import-template.csv" class="template-btn" download>Download Template</a>
            <input type="file" id="excelUploadInput" accept=".xlsx,.xls,.csv" hidden>
        </div>
    </form>
    <p class="import-note">Required Excel columns: itemName, category, quantity, buyingPrice, sellingPrice. Item code is auto-generated by the system from the category and upload time.</p>
    <div id="messageBox" class="message-box"></div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
